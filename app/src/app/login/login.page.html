<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReportaYa - Inicio de Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'League Spartan', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #074aad;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      overflow-y: auto; /* Para desplazarse en pantallas pequeñas */
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .app-icon {
      width: clamp(100px, 25vw, 120px);
      height: clamp(100px, 25vw, 120px);
      margin: 0 auto 15px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    

    .app-title {
      color: white;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .app-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: white;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
      -webkit-appearance: none;
    }

    .form-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.7);
      background-color: rgba(255, 255, 255, 0.15);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 15px;
      -webkit-appearance: none;
      min-height: 50px;
    }

    .btn-primary {
      background-color: white;
      color: #000000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background-color: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .forgot-password {
      text-align: center;
      margin-top: 20px;
    }

    .forgot-password a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 14px;
    }

    .alternative-login {
      text-align: center;
      margin: 15px 0;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    .google-login {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .google-login img {
      width: 35px;
      height: 35px;
      transition: transform 0.3s ease;
    }

    /* ======= MEDIA QUERIES ======= */

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 15px;
      }

      .login-container {
        padding: 25px 20px;
        border-radius: 15px;
      }

      .app-icon {
        width: 90px;
        height: 90px;
      }

      .app-title {
        font-size: 26px;
      }
    }

    @media (min-width: 768px) {
      .login-container {
        max-width: 480px;
        padding: 40px;
      }

      .app-icon {
        width: 130px;
        height: 130px;
      }

      .app-title {
        font-size: 38px;
      }
    }

    @media (max-height: 600px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .login-container {
        margin-top: 10px;
      }

      .app-icon {
        width: 70px;
        height: 70px;
      }

      .app-title {
        font-size: 24px;
      }
    }

    @supports(padding: max(0px)) {
      body {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }

    @media (hover: hover) {
      .btn-primary:hover {
        background-color: #f0f0f0;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
      }

      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .google-login img:hover {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="assets/icono-app.png" alt="Icono de ReportaYa" class="app-icon">
      <img src="assets/logo_muni.png" alt="Icono de ReportaYa" class="app-icon">
      <h1 class="app-title">ReportaYa</h1>
      <p class="app-subtitle">Bienvenido de nuevo</p>
    </div>

    <form (ngSubmit)="onSubmit($event)">
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-input" placeholder="Ingresa tu correo electrónico" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña" required>
      </div>

      <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>

    <button class="btn btn-secondary" routerLink="/register">Crear Cuenta</button>
    <button class="btn btn-secondary" routerLink="/phone-login">Inicio con Número</button>

    <div class="alternative-login">
      <span>También puedes iniciar sesión con</span>
    </div>

    <div class="google-login">
      <a (click)="loginGoogle()"><img src="assets/google-logo.png" alt="Logo de Google"></a>
    </div>
  </div>
</body>
</html>
