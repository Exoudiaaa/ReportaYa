<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportaYa - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'League Spartan', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #a12424;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .app-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }
        
        .app-title {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .app-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        
        .form-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.7);
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            -webkit-appearance: none;
            min-height: 50px;
        }
        
        .btn-primary {
            background-color: white;
            color: #a12424;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary:active {
            background-color: #f0f0f0;
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:active {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        
        .forgot-password a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .forgot-password a:active {
            color: white;
            text-decoration: underline;
        }

        .alternative-login {
            text-align: center;
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .google-login {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .google-login img {
            width: 35px;
            height: 35px;
            transition: transform 0.3s ease;
        }

        .google-login img:active {
            transform: scale(0.95);
        }

        /* ========== RESPONSIVE ADJUSTMENTS ========== */

        /* Móviles pequeños */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start;
                min-height: 100vh;
            }
            
            .login-container {
                padding: 25px 20px;
                max-width: 100%;
                margin-top: 20px;
            }
            
            .app-title {
                font-size: 28px;
            }
            
            .app-icon {
                width: 100px;
                height: 100px;
            }

            .app-subtitle {
                font-size: 15px;
            }

            .form-input {
                padding: 14px;
                font-size: 16px;
            }

            .btn {
                padding: 14px;
                min-height: 48px;
                font-size: 15px;
            }
        }

        /* Móviles muy pequeños */
        @media (max-width: 360px) {
            .login-container {
                padding: 20px 15px;
                border-radius: 15px;
            }
            
            .app-title {
                font-size: 26px;
            }
            
            .app-icon {
                width: 90px;
                height: 90px;
            }

            .app-subtitle {
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .btn {
                margin-bottom: 12px;
            }

            .forgot-password {
                margin-top: 15px;
            }
        }

        /* Tablets y pantallas más grandes */
        @media (min-width: 768px) {
            body {
                padding: 40px;
            }
            
            .login-container {
                max-width: 450px;
                padding: 35px 30px;
            }
            
            .app-icon {
                width: 130px;
                height: 130px;
            }
            
            .app-title {
                font-size: 36px;
            }
            
            .app-subtitle {
                font-size: 17px;
            }
        }

        /* Pantallas grandes */
        @media (min-width: 1024px) {
            .login-container {
                max-width: 500px;
                padding: 40px 35px;
            }
            
            .app-title {
                font-size: 38px;
            }
        }

        /* Modo landscape en móviles */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            
            .login-container {
                padding: 20px;
                margin-top: 10px;
                max-height: 95vh;
                overflow-y: auto;
            }
            
            .logo-section {
                margin-bottom: 20px;
            }
            
            .app-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 10px;
            }
            
            .app-title {
                font-size: 24px;
            }
            
            .app-subtitle {
                font-size: 14px;
                margin-bottom: 15px;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            .form-input {
                padding: 12px;
            }
            
            .btn {
                padding: 12px;
                min-height: 45px;
                margin-bottom: 12px;
            }

            .forgot-password {
                margin-top: 15px;
            }
        }

        /* Altura muy reducida */
        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 20px;
            }
            
            .login-container {
                margin-top: 0;
            }
            
            .logo-section {
                margin-bottom: 20px;
            }
            
            .app-icon {
                width: 90px;
                height: 90px;
            }
            
            .app-title {
                font-size: 26px;
            }
        }

        /* iPhone SE y dispositivos muy pequeños */
        @media (max-width: 320px) and (max-height: 667px) {
            .login-container {
                padding: 18px 12px;
            }
            
            .app-icon {
                width: 50px;
                height: 50px;
            }
            
            .app-title {
                font-size: 24px;
            }
            
            .form-input {
                padding: 12px;
            }
            
            .btn {
                padding: 12px;
                min-height: 44px;
            }
        }

        /* Prevenir zoom en inputs en iOS */
        @media screen and (max-width: 768px) {
            .form-input {
                font-size: 16px;
            }
        }

        /* Soporte para dispositivos con notch */
        @supports(padding: max(0px)) {
            body {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-top: max(20px, env(safe-area-inset-top));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }

        /* Scroll suave para contenedor en landscape */
        .login-container {
            -webkit-overflow-scrolling: touch;
        }

        /* Estados hover solo para dispositivos que los soportan */
        @media (hover: hover) {
            .btn-primary:hover {
                background-color: #f0f0f0;
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
            }
            
            .btn-secondary:hover {
                background-color: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.5);
            }
            
            .forgot-password a:hover {
                color: white;
                text-decoration: underline;
            }

            .google-login img:hover {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="assets/icono-app.png" alt="Icono de ReportaYa" class="app-icon">
            <h1 class="app-title">ReportaYa</h1>
            <p class="app-subtitle">Bienvenido de nuevo</p>
        </div>
        
        <form (ngSubmit)="onSubmit($event)">
            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input type="email" id="email" class="form-input" placeholder="Ingresa tu correo electrónico" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>

        <button class="btn btn-secondary" routerLink="/register">Crear Cuenta</button>
        <button class="btn btn-secondary">Inicio con Número</button>
        <div class="alternative-login">
            <a>También puedes iniciar sesión con</a>
        </div>
        
        <div class="google-login">
            <a (click)="loginGoogle()"><img src="assets/google-logo.png" alt="Logo de Google"></a>
        </div>
    </div>
</body>
</html>
