<ion-header>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <ion-toolbar class="toolbar-header" style="padding-top:22px;">
    <ion-buttons slot="start" class="back-button">
      <ion-back-button defaultHref="/home" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>


    <div style="display:flex; align-items:center; width:100%; ">
        <span style="font-size: clamp(26px, 6vw, 40px); font-weight: bold; color:black;font-family: 'Poppins',sans-serif; ">
          Asignaciones
        </span>

        <img src="assets/icono-app.png" alt="Logo" 
            style="height:50px; margin-left:auto;">
      </div>


  </ion-toolbar>
</ion-header>

<ion-content fullscreen="false" style="padding-top: 0; padding-bottom: calc(16px + var(--app-safe-area-bottom));" class="ion-padding content-bg">

  <ion-list *ngIf="reportes.length > 0; else sinReportes" class="reportes-list">
    <ion-item *ngFor="let reporte of reportes" class="reporte-item"  (click)="verDetalle(reporte)">
      <ion-label class="reporte-label">
        <h2 class="reporte-descripcion">{{ reporte.descripcion }}</h2>
        <div class="reporte-details">
          <div class="detail-row">
            <ion-icon name="location" class="detail-icon"></ion-icon>
            <span class="detail-text">{{ reporte.ubicacion }}</span>
          </div>
          <div class="detail-row">
            <ion-icon name="time" class="detail-icon"></ion-icon>
            <span class="detail-text">
              {{ reporte.fecha?.toDate ? (reporte.fecha.toDate() | date:'short') : (reporte.fecha | date:'short') }}
            </span>
          </div>
          <div class="detail-row">
            <ion-icon name="flag" class="detail-icon"></ion-icon>
            <ion-badge [color]="obtenerColorEstado(reporte.estado)" class="estado-badge">
              {{ obtenerEstadoTexto(reporte.estado) }}
            </ion-badge>
          </div>
        </div>
      </ion-label>
    </ion-item>
  </ion-list>

  <ng-template #sinReportes>
    <div class="sin-reportes-container">
      <ion-icon name="document-text" class="sin-reportes-icon"></ion-icon>
      <ion-text color="medium" class="sin-reportes-text">
        <p>No tienes reportes asignados</p>
      </ion-text>
    </div>
  </ng-template>

</ion-content>
