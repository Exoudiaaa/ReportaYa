<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReportaYa - Crear Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'League Spartan', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #074aad;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .back-button {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .back-button:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.2);
    }

    .back-arrow {
      color: white;
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
    }

    .register-container {
      width: 100%;
      max-width: 100%;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      margin: 0 auto;
      position: relative;
    }

    /* 🔹 Logo actualizado con imagen local */
    .logo-section {
      text-align: center;
      margin-bottom: 25px;
      margin-top: 10px;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
      display: block;
      border-radius: 24px;
      object-fit: cover;
    
      padding: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .app-icon:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .app-title {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .app-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: white;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
      -webkit-appearance: none;
    }

    .form-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.7);
      background-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .password-requirements {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
      padding: 0 5px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 15px;
      -webkit-appearance: none;
      min-height: 54px;
    }

    .btn-primary {
      background-color: white;
      color: #a12424;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-primary:active {
      background-color: #f0f0f0;
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      padding: 15px 0;
    }

    .login-link a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .login-link a:active {
      color: white;
      text-decoration: underline;
    }

    /* Scroll */
    .form-content {
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 5px;
    }

    .form-content::-webkit-scrollbar {
      width: 4px;
    }

    .form-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    /* Responsive ajustes */
    @media (max-height: 700px) {
      .app-icon {
        width: 80px;
        height: 80px;
      }
      .app-title {
        font-size: 24px;
      }
      .btn {
        padding: 16px;
        min-height: 50px;
      }
    }

    @media (max-width: 360px) {
      .back-button {
        top: 15px;
        left: 15px;
        width: 40px;
        height: 40px;
      }
    }

    @media screen and (max-width: 768px) {
      .form-input {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <!-- Botón de retroceso -->
  <div class="back-button" routerLink="/login">
    <div class="back-arrow">←</div>
  </div>

  <div class="register-container">
    <div class="form-content">
      <div class="logo-section">
        <img src="assets/icono-app.png" alt="Icono de ReportaYa" class="app-icon">
        <h1 class="app-title">ReportaYa</h1>
        <p class="app-subtitle">Crear Nueva Cuenta</p>
      </div>

      <form id="registerForm" (submit)="onSubmit($event)">
        <div class="form-group">
          <label class="form-label" for="firstName">Nombre</label>
          <input type="text" id="firstName" class="form-input" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">Apellido</label>
          <input type="text" id="lastName" class="form-input" placeholder="Tu apellido" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="tu.correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Teléfono</label>
          <input type="tel" id="phone" class="form-input" placeholder="9 1234 5678" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="Crea una contraseña segura" required>
          <div class="password-requirements">
            Mínimo 8 caracteres, incluir mayúsculas, minúsculas y números.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Repite tu contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
      </form>

      <div class="login-link">
        <a routerLink="/login">¿Ya tienes una cuenta? Inicia Sesión</a>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
