<ion-header>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <ion-toolbar class="toolbar-header" style="padding-top:25px;">
    <ion-buttons slot="start" class="back-button">
      <ion-back-button defaultHref="/home" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>

    <div style="display:flex; align-items:center; width:100%; ">
        <span style="font-size: clamp(26px, 6vw, 40px); font-weight: bold; color:black; font-family:'Quicksand',sans-serif;">
          Menu
        </span>

        <img src="assets/icono-app.png" alt="Logo" 
            style="height:50px; margin-left:auto;">
      </div>


  


  </ion-toolbar>
</ion-header>

<ion-content fullscreen="false" style="padding-top: 0; padding-bottom: calc(16px + var(--app-safe-area-bottom));"  class="ion-padding">

  <ion-list  lines="full">


    <ion-item>
      <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
      <ion-label>
        <h2>{{ username }}</h2>
        <p>{{ userEmail }}</p>
      </ion-label>
    </ion-item>

    <ion-item button (click)="abrirHistorial()" >
      <ion-icon name="time-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Historial de Reportes</ion-label>
    </ion-item>

    <ion-item button (click)="abrirMenuPrincipal()" >
      <ion-icon name="time-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Historial de solicitud de Grabaciones</ion-label>
    </ion-item>

    <ion-item button disabled class="item-disabled">
  <ion-icon name="settings-outline" slot="start" color="medium"></ion-icon>
  <ion-label>Configuración</ion-label>
</ion-item>

    <ion-item button color="danger" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    <ion-label>Cerrar sesión</ion-label>
  </ion-item>

  </ion-list>


</ion-content>
