<ion-header>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <ion-toolbar class="toolbar-header">
    <ion-buttons slot="start" class="back-button">
      <ion-back-button defaultHref="/home" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <div  class="header-content">
      
      <span class="header-title">
        Menu
      </span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content  class="ion-padding">

  <ion-list  lines="full">

    <ion-item button (click)="abrirHistorial()" >
      <ion-icon name="time-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Historial de reportes</ion-label>
    </ion-item>

    <ion-item button (click)="abrirMenuPrincipal()" >
      <ion-icon name="time-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Historial de solicitud de camaras</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="settings-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Configuración</ion-label>
    </ion-item>

    <ion-item button color="danger" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    <ion-label>Cerrar sesión</ion-label>
  </ion-item>

  </ion-list>


</ion-content>
